name: appfute
description: "A new Flutter project."

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_fonts: ^8.1.0
  cloud_firestore: ^6.3.0
  http: ^1.6.0
  cloud_functions: ^6.3.0
  package_info_plus: ^10.1.0
  image_picker: ^1.2.2
  firebase_storage: ^13.4.1
  image_cropper: ^12.2.1
  share_plus: ^13.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 # Deixe apenas como pacote aqui

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo_appfute.png # Caminho completo conforme sua pasta

# ESTE BLOCO DEVE FICAR FORA DE TUDO, NO FINAL DO ARQUIVO
flutter_launcher_icons:
